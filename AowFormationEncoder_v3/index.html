<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>이미지 → 반죽 변환기 (아레나 전용)</title>
  <meta name="color-scheme" content="dark light" />
  <link rel="stylesheet" href="style.css" />

  <!-- OpenCV.js: Promise/구형 런타임 모두 지원하는 순차 CDN 로더 -->
  <script>
  (function(){
    const OPENCV_URLS = [
      'https://docs.opencv.org/4.10.0/opencv.js',
      'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.10.0-release.1/dist/opencv.js'
    ];
    const LOAD_TIMEOUT_MS = 20000;

    function setCvStatus(text){
      const status = document.getElementById('status');
      const templateStatus = document.getElementById('tplStatus');
      if (status) status.textContent = text;
      if (templateStatus) templateStatus.textContent = text;
    }

    function withTimeout(promise, timeout, message){
      let timer;
      return Promise.race([
        promise,
        new Promise((_, reject) => {
          timer = setTimeout(() => reject(new Error(message)), timeout);
        })
      ]).finally(() => clearTimeout(timer));
    }

    function loadScript(src){
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        let settled = false;

        const finish = (error) => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          script.onload = null;
          script.onerror = null;

          if (error) {
            script.remove();
            reject(error);
          } else {
            resolve(script);
          }
        };

        const timer = setTimeout(() => {
          finish(new Error('스크립트 로드 시간 초과: ' + src));
        }, LOAD_TIMEOUT_MS);

        script.src = src;
        script.async = true;
        script.onload = () => finish(null);
        script.onerror = () => finish(new Error('스크립트 요청 실패: ' + src));
        document.head.appendChild(script);
      });
    }

    async function resolveCvModule(){
      let cvModule = window.cv;
      if (!cvModule) throw new Error('스크립트는 로드됐지만 window.cv가 없습니다.');

      // 최신 OpenCV.js 빌드는 cv를 Promise로 노출할 수 있습니다.
      if (typeof cvModule.then === 'function') {
        cvModule = await withTimeout(
          Promise.resolve(cvModule),
          LOAD_TIMEOUT_MS,
          'OpenCV Promise 초기화 시간 초과'
        );
      } else if (!cvModule.Mat || typeof cvModule.imread !== 'function') {
        // 구형 빌드는 onRuntimeInitialized 콜백으로 준비 완료를 알립니다.
        cvModule = await withTimeout(new Promise((resolve, reject) => {
          const previousHandler = cvModule.onRuntimeInitialized;
          cvModule.onRuntimeInitialized = function(){
            try {
              if (typeof previousHandler === 'function') previousHandler();
            } finally {
              resolve(cvModule);
            }
          };

          // 콜백 등록 직전에 초기화가 끝난 경우를 한 번 더 확인합니다.
          if (cvModule.Mat && typeof cvModule.imread === 'function') {
            resolve(cvModule);
          }
        }), LOAD_TIMEOUT_MS, 'OpenCV 런타임 초기화 시간 초과');
      }

      if (!cvModule || !cvModule.Mat || typeof cvModule.imread !== 'function') {
        throw new Error('OpenCV API가 올바르게 초기화되지 않았습니다.');
      }

      window.cv = cvModule;
      return cvModule;
    }
    window.cvReadyPromise = (async function(){
      let lastError = null;

      for (const url of OPENCV_URLS) {
        let script = null;
        try {
          setCvStatus('OpenCV.js 로딩 중… ' + url);
          script = await loadScript(url);
          setCvStatus('OpenCV.js 초기화 중…');

          const cvModule = await resolveCvModule();
          setCvStatus('OpenCV.js 준비 완료');
          return cvModule;
        } catch (error) {
          lastError = error;
          console.error('[OpenCV.js]', url, error);
          if (script) script.remove();
          try { delete window.cv; } catch (_) { window.cv = undefined; }
        }
      }
